# Publish the OpenDots `app` image to Softnetics GHCR (primary deploy target).
#
# Image: ghcr.io/softnetics/opendots
# Build: docker build --target app (linux/amd64)
#
# Auth: GITHUB_TOKEN with packages:write (repo is softnetics/opendots).
# No extra PAT or SOFTNETICS_GHCR_TOKEN secret is required.
#
# Softnetics / GitOps: after a successful tag run, pin the digest of
# ghcr.io/softnetics/opendots:<tag> (e.g. v1.0.0 or 1.0.0), not a floating tag.
# Cluster pull already uses Softnetics `ghcr-pull-secret`.

name: Publish image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PRIMARY_IMAGE: ghcr.io/softnetics/opendots

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PRIMARY_IMAGE }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push app image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary for GitOps
        run: |
          {
            echo "### Published image"
            echo ""
            echo "Primary (Softnetics GitOps): \`${PRIMARY_IMAGE}\`"
            echo ""
            echo "| Ref | Value |"
            echo "| --- | --- |"
            echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo ""
            echo "Pin GitOps to the digest above (e.g. \`${PRIMARY_IMAGE}@${{ steps.build.outputs.digest }}\`), not a mutable tag."
          } >> "$GITHUB_STEP_SUMMARY"
