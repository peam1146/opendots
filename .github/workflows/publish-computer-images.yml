# Publish OpenDots computer + supervisor images to Softnetics GHCR.
#
# Images:
#   ghcr.io/softnetics/opendots-computer
#   ghcr.io/softnetics/opendots-supervisor
#
# Build recipes match compose.computers.yml:
#   - computer: CopilotKit/OpenBot git context at OPENBOT_REF,
#     Dockerfile agent-computer/Dockerfile
#   - supervisor: deployment/computers/supervisor.Dockerfile with
#     BuildKit additional context `openbot` at the same pin, plus the
#     fail-closed per-Dot HMAC patch (see deployment/computers/README.md)
#
# Auth: GITHUB_TOKEN with packages:write (repo is softnetics/opendots).
# No extra PAT or SOFTNETICS_GHCR_TOKEN secret is required.
#
# Softnetics / GitOps: after a successful run, pin BOTH digests from the
# step summary. Keep supervisor paired with the computer image revision
# it expects (same OpenBot pin / publish run). Set supervisor env
# COMPUTER_IMAGE to the published computer image ref (digest preferred).

name: Publish computer images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Must stay identical to compose.computers.yml OpenBot pin.
  OPENBOT_REF: b6932d31a8d6e7896c15139dfc27a6c6911deb27
  OPENBOT_SHORT: b6932d3
  OPENBOT_GIT: https://github.com/CopilotKit/OpenBot.git
  COMPUTER_IMAGE: ghcr.io/softnetics/opendots-computer
  SUPERVISOR_IMAGE: ghcr.io/softnetics/opendots-supervisor

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify OpenBot pin matches compose
        run: |
          set -euo pipefail
          expected="${OPENBOT_GIT}#${OPENBOT_REF}"
          # Compose pins the same OpenBot revision twice; refuse drift vs this workflow.
          if ! grep -F "context: ${expected}" compose.computers.yml >/dev/null; then
            echo "computer-image build context missing expected OpenBot pin: ${expected}"
            exit 1
          fi
          if ! grep -F "openbot: ${expected}" compose.computers.yml >/dev/null; then
            echo "supervisor additional_contexts.openbot missing expected OpenBot pin: ${expected}"
            exit 1
          fi
          echo "OpenBot pin matches compose.computers.yml: ${expected}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Computer image metadata
        id: meta-computer
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.COMPUTER_IMAGE }}
          tags: |
            type=raw,value=${{ env.OPENBOT_SHORT }}
            type=semver,pattern={{raw}},prefix=${{ env.OPENBOT_SHORT }}-
            type=semver,pattern={{version}},prefix=${{ env.OPENBOT_SHORT }}-
            type=sha,prefix=${{ env.OPENBOT_SHORT }}-sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Supervisor image metadata
        id: meta-supervisor
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SUPERVISOR_IMAGE }}
          tags: |
            type=raw,value=${{ env.OPENBOT_SHORT }}-dot-auth
            type=semver,pattern={{raw}},prefix=${{ env.OPENBOT_SHORT }}-dot-auth-
            type=semver,pattern={{version}},prefix=${{ env.OPENBOT_SHORT }}-dot-auth-
            type=sha,prefix=${{ env.OPENBOT_SHORT }}-dot-auth-sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push computer image
        id: build-computer
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.OPENBOT_GIT }}#${{ env.OPENBOT_REF }}
          file: agent-computer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-computer.outputs.tags }}
          labels: ${{ steps.meta-computer.outputs.labels }}
          cache-from: type=gha,scope=opendots-computer
          cache-to: type=gha,mode=max,scope=opendots-computer

      - name: Build and push supervisor image
        id: build-supervisor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/computers/supervisor.Dockerfile
          build-contexts: |
            openbot=${{ env.OPENBOT_GIT }}#${{ env.OPENBOT_REF }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-supervisor.outputs.tags }}
          labels: ${{ steps.meta-supervisor.outputs.labels }}
          cache-from: type=gha,scope=opendots-supervisor
          cache-to: type=gha,mode=max,scope=opendots-supervisor

      - name: Image summary for GitOps
        run: |
          {
            echo "### Published computer images"
            echo ""
            echo "Keep **supervisor** paired with the **computer** image from the same OpenBot pin (\`${OPENBOT_SHORT}\` / \`${OPENBOT_REF}\`) and preferably the same publish run."
            echo "GitOps: set supervisor env \`COMPUTER_IMAGE\` to the computer digest below."
            echo ""
            echo "| Image | Tags | Digest |"
            echo "| --- | --- | --- |"
            echo "| \`${COMPUTER_IMAGE}\` | \`${{ steps.meta-computer.outputs.tags }}\` | \`${{ steps.build-computer.outputs.digest }}\` |"
            echo "| \`${SUPERVISOR_IMAGE}\` | \`${{ steps.meta-supervisor.outputs.tags }}\` | \`${{ steps.build-supervisor.outputs.digest }}\` |"
            echo ""
            echo "Pin GitOps to digests:"
            echo "- \`${COMPUTER_IMAGE}@${{ steps.build-computer.outputs.digest }}\`"
            echo "- \`${SUPERVISOR_IMAGE}@${{ steps.build-supervisor.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
